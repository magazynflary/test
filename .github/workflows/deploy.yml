name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      only_if_audio_changed:
        description: "Build only if the audio recordings changed (what the hourly run does)"
        type: boolean
        default: false
  # Hourly: picks up recordings uploaded to the audio server, for the article
  # players. The check job skips the build when the recordings are unchanged,
  # so it builds only after an upload, a correction or a removal.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The audio server's article -> recording list (audio-feed) for the article
  # players. The repository variable PODCAST_EPISODES_URL overrides it (the
  # test site points at the testing server).
  PODCAST_EPISODES_URL: ${{ vars.PODCAST_EPISODES_URL || 'https://audio.magazynflary.pl/episodes.json' }}
  # The podcast feed for the subscribe page and <head>; PODCAST_FEED_URL overrides it.
  PODCAST_FEED_URL: ${{ vars.PODCAST_FEED_URL || 'https://audio.magazynflary.pl/podcast.xml' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Did the recordings change?
        id: check
        env:
          ONLY_IF_CHANGED: ${{ github.event_name == 'schedule' || inputs.only_if_audio_changed == true }}
          # The list the published site was built with (partials/podcast-episodes.html).
          PUBLISHED_COPY_URL: ${{ steps.pages.outputs.base_url }}/podcast-episodes.json
        run: |
          if [ "$ONLY_IF_CHANGED" != "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # jq -e with "objects": anything but a JSON object under .episodes
          # counts as unavailable. Numbers are normalized (". + 0"): Hugo's
          # --minify rewrites them in the published copy (1000 -> 1E+3).
          EPISODES='.episodes | objects | walk(if type == "number" then . + 0 else . end)'
          if ! current=$(curl -fsS --max-time 30 "$PODCAST_EPISODES_URL" | jq -ecS "$EPISODES"); then
            echo "Audio server unavailable - nothing to update, the published players stay."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published=$(curl -fsS --max-time 30 "$PUBLISHED_COPY_URL" | jq -ecS "$EPISODES" || echo "none")
          if [ "$current" = "$published" ]; then
            echo "Recordings unchanged - no build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Recordings changed - building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The test site must never point at the production newsletter server
      # (sign-ups from staging would go to the real list). prod builds with
      # this same file (ported from test), hence the repository condition -
      # fail closed: the step runs everywhere except magazynflary/prod (a
      # fork or a renamed test repository is checked too).
      # The host is compared the way a browser would read the form's action:
      # any case, backslashes as slashes, scheme-relative "//host", a
      # trailing dot, %-escapes, userinfo and port ignored. hugo.toml keys
      # are read case-insensitively, as Hugo does ([params.Newsletter] URL).
      - name: Newsletter points at the testing server only
        if: github.repository != 'magazynflary/prod'
        env:
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
        run: |
          python3 - <<'EOF'
          import os, re, sys, tomllib, unicodedata, urllib.parse

          PRODUCTION = "newsletter.magazynflary.pl"

          def values(tables, key):
              """Hugo's config keys are case-insensitive: every match counts."""
              return [v for t in tables if isinstance(t, dict)
                      for k, v in t.items() if k.lower() == key]

          def hosts(url):
              u = re.sub(r"[\t\n\r]", "", url).strip().replace("\\", "/")
              for v in (u, re.sub(r"^[a-zA-Z][a-zA-Z0-9+.-]*:", "", u)):  # with and without a scheme
                  v = v.lstrip("/")
                  v = re.split(r"[/?#]", v, maxsplit=1)[0]
                  v = v.rsplit("@", 1)[-1]  # userinfo
                  v = re.sub(r":[0-9]*$", "", v)  # port
                  v = unicodedata.normalize("NFKC", urllib.parse.unquote(v))
                  yield v.strip().lower().rstrip(".")

          with open("hugo.toml", "rb") as f:
              config = tomllib.load(f)
          toml_urls = [str(v) for v in values(values(values([config], "params"), "newsletter"), "url")]
          env_url = os.environ.get("NEWSLETTER_URL", "")
          for url in [env_url, *toml_urls]:
              if PRODUCTION in hosts(url):
                  print(f"::error::The newsletter URL '{url}' (repository variable NEWSLETTER_URL or hugo.toml [params.newsletter] url) is the PRODUCTION server. The test site may point only at the testing server.")
                  sys.exit(1)
          print("Newsletter URL:", env_url or next(filter(None, toml_urls), "") or "(none - coming soon)")
          EOF

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          HUGO_PARAMS_PODCAST_EPISODESURL: ${{ env.PODCAST_EPISODES_URL }}
          HUGO_PARAMS_PODCAST_FEEDURL: ${{ env.PODCAST_FEED_URL }}
          # Newsletter form target (hugo.toml [params.newsletter]). Exported
          # only when set - an empty HUGO_PARAMS_* would blank the hugo.toml
          # value. No URL or list UUID = "coming soon", no form.
          # test: hugo.toml is empty; both variables hold the TESTING
          # server's URL and list UUID only (the guard step above enforces
          # it). prod: hugo.toml holds the production URL and only
          # NEWSLETTER_LIST_UUID is set. NEWSLETTER_URL is never set on prod:
          # it would override hugo.toml, and the guard does not run there.
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
          NEWSLETTER_LIST_UUID: ${{ vars.NEWSLETTER_LIST_UUID }}
        run: |
          if [ -n "$NEWSLETTER_URL" ]; then export HUGO_PARAMS_NEWSLETTER_URL="$NEWSLETTER_URL"; fi
          if [ -n "$NEWSLETTER_LIST_UUID" ]; then export HUGO_PARAMS_NEWSLETTER_LISTUUID="$NEWSLETTER_LIST_UUID"; fi
          hugo \
            --minify \
            --buildFuture \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
