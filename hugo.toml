baseURL = 'https://drlzin.github.io/test/'
enableRobotsTXT = true
locale = 'pl'
defaultContentLanguage = 'pl'
title = 'Flary'

[taxonomies]
tag = 'tags'

[permalinks]
  artykuly = '/:year/:month/:day/:slug/'
  wydania = '/wydania/:contentbasename/'

[markup.goldmark.extensions.typographer]
leftDoubleQuote = '&bdquo;'
rightDoubleQuote = '&ldquo;'
leftSingleQuote = '&raquo;'
rightSingleQuote = '&laquo;'

[outputs]
home = ['html', 'rss', 'podcastindex', 'podcastepisodes']
section = ['html', 'rss']

# /podcast-index.json - article data for the podcast feed, which is built
# on the audio server (audio-feed). Template: layouts/index.podcastindex.json.
[outputFormats.podcastindex]
mediaType = 'application/json'
baseName = 'podcast-index'
isPlainText = true
notAlternative = true

# /podcast-episodes.json - the copy of the audio server's episodes.json this
# build used for the article players (partials/podcast-episodes.html): the
# fallback when the audio server is down at the next build, and the marker
# the scheduled build compares (.github/workflows/deploy.yml).
[outputFormats.podcastepisodes]
mediaType = 'application/json'
baseName = 'podcast-episodes'
isPlainText = true
notAlternative = true

# Remote resources (only episodes.json) are fetched fresh on every build.
[caches.getresource]
maxAge = 0

[params]
description = 'W trosce o dobro wspólne. Solidarni. Otwarci na dialog.'

[params.podcast]
# The audio server's article -> recording list (audio-feed). CI overrides it
# with the repository variable PODCAST_EPISODES_URL when set (the test site
# uses the testing server); see .github/workflows/deploy.yml.
episodesURL = 'https://audio.magazynflary.pl/episodes.json'

[params.sectionTitles]
artykuly = "Artykuły"
wydania = "Wydania"


# Newsletter - listmonk at newsletter.magazynflary.pl (infrastructure
# repository: docs/newsletter.md). The form (partials/newsletter-form.html)
# posts straight to listmonk, which redirects back to the "check your
# inbox" page after a sign-up. listmonk only redirects to - and only
# allows CORS (needed by the ALTCHA widget) from - addresses listed
# EXACTLY in listmonk -> Settings -> Security -> Trusted URLs: put the
# full URL of /newsletter/sprawdz-skrzynke/ of every site there.
# CI overrides url and listUUID with the repository variables
# NEWSLETTER_URL and NEWSLETTER_LIST_UUID when set (the test site uses
# the testing server) - .github/workflows/deploy.yml.
[params.newsletter]
url = "https://newsletter.magazynflary.pl"
# The UUID of the newsletter list in listmonk (public, double opt-in).
# Empty = no form, a "coming soon" note instead (and a build warning).
listUUID = ""
# ALTCHA proof-of-work captcha (self-hosted by listmonk, no third
# party). Must match listmonk -> Settings -> Security -> CAPTCHA.
captcha = true
